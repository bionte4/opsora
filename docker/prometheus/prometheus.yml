global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9101"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9102"]
  - job_name: notifier
    static_configs:
      - targets: ["notifier:9103"]
  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:9104"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
