image: golang:1.27
timeout: 15m
env:
  GOMODCACHE: /workspace/.cache/go-mod
  GOCACHE: /workspace/.cache/go-build
steps:
  - name: download modules
    run: go -C api-server mod download && go -C worker mod download && go -C notifier mod download && go -C shared mod download
  - name: vet
    run: go vet ./api-server/... ./worker/... ./notifier/... ./shared/...
  - name: test
    run: go test ./api-server/... ./worker/... ./notifier/... ./shared/...
  - name: build
    run: go build ./api-server/... ./worker/... ./notifier/... ./shared/...
