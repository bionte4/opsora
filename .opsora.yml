image: golang:1.27
timeout: 15m
env:
  GOMODCACHE: /workspace/.cache/go-mod
  GOCACHE: /workspace/.cache/go-build
steps:
  - name: download modules
    run: for m in api-server worker notifier ai-service shared; do go -C $m mod download || exit 1; done
  - name: vet
    run: go vet ./api-server/... ./worker/... ./notifier/... ./ai-service/... ./shared/...
  - name: test
    run: go test ./api-server/... ./worker/... ./notifier/... ./ai-service/... ./shared/...
  - name: build
    run: go build ./api-server/... ./worker/... ./notifier/... ./ai-service/... ./shared/...
